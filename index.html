<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Git Geçmişi Görselleştiricisi</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --bg2: #161b22;
    --bg3: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --text2: #8b949e;
    --text3: #484f58;
    --main: #58a6ff;
    --green: #3fb950;
    --orange: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
    --pink: #ff7b72;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Sora', sans-serif;
    min-height: 100vh;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--bg2);
  }
  .logo {
    width: 36px; height: 36px;
    background: var(--main);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
  }
  header span {
    font-size: 13px;
    color: var(--text2);
    font-family: 'JetBrains Mono', monospace;
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr 360px;
    height: calc(100vh - 77px);
  }

  /* LEFT: graph */
  .graph-panel {
    overflow-y: auto;
    padding: 24px;
    border-right: 1px solid var(--border);
  }

  .graph-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .graph-header h2 {
    font-size: 14px;
    font-weight: 500;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  .branch-pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .branch-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 99px;
    border: 1px solid var(--border);
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text2);
    background: var(--bg3);
    cursor: pointer;
    transition: all .15s;
  }
  .branch-pill:hover { border-color: var(--text2); color: var(--text); }
  .branch-pill.active { border-color: var(--main); color: var(--main); }
  .branch-dot { width: 8px; height: 8px; border-radius: 50%; }

  #graph-canvas {
    display: block;
    width: 100%;
    cursor: default;
  }

  /* RIGHT: detail panel */
  .detail-panel {
    overflow-y: auto;
    padding: 24px;
    background: var(--bg);
  }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 24px;
  }
  .stat {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
  }
  .stat .num {
    font-size: 24px;
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text);
  }
  .stat .lbl {
    font-size: 11px;
    color: var(--text2);
    margin-top: 4px;
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text3);
  }
  .empty-state .icon { font-size: 32px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  .commit-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

  .commit-card .tag-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .tag {
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    padding: 3px 9px;
    border-radius: 6px;
    font-weight: 500;
  }
  .tag-hash { background: rgba(88,166,255,.12); color: var(--main); }
  .tag-branch { background: rgba(63,185,80,.12); color: var(--green); }
  .tag-merge { background: rgba(188,140,255,.12); color: var(--purple); }
  .tag-release { background: rgba(210,153,34,.12); color: var(--orange); }

  .commit-card h3 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 14px;
    line-height: 1.4;
  }

  .meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
  }
  .meta-item {
    background: var(--bg3);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .meta-item .key {
    font-size: 11px;
    color: var(--text3);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .meta-item .val {
    font-size: 13px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
  }

  .files-section h4 {
    font-size: 12px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: 10px;
  }
  .file-list { display: flex; flex-direction: column; gap: 6px; }
  .file-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--bg3);
    border-radius: 8px;
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
  }
  .file-status {
    width: 20px; height: 20px;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .fs-add { background: rgba(63,185,80,.2); color: var(--green); }
  .fs-mod { background: rgba(210,153,34,.2); color: var(--orange); }
  .fs-del { background: rgba(248,81,73,.2); color: var(--red); }
  .file-name { color: var(--text2); }

  .parents-section {
    margin-top: 16px;
  }
  .parents-section h4 {
    font-size: 12px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: 8px;
  }
  .parent-hash {
    display: inline-block;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--main);
    background: rgba(88,166,255,.1);
    padding: 3px 8px;
    border-radius: 5px;
    margin-right: 6px;
    cursor: pointer;
  }
  .parent-hash:hover { background: rgba(88,166,255,.2); }

  .hint-bar {
    margin-top: 12px;
    font-size: 12px;
    color: var(--text3);
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
  }
</style>
</head>
<body>

<header>
  <div class="logo">⎇</div>
  <div>
    <h1>Git Geçmişi Görselleştiricisi</h1>
    <span>myproject / main</span>
  </div>
</header>

<div class="layout">
  <div class="graph-panel">
    <div class="graph-header">
      <h2>Commit Geçmişi</h2>
    </div>
    <div class="branch-pills" id="branch-pills"></div>
    <canvas id="graph-canvas"></canvas>
    <p class="hint-bar">↑ Bir commit'e tıkla → detayları sağda görürsün</p>
  </div>

  <div class="detail-panel">
    <div class="stats">
      <div class="stat"><div class="num" id="s-commits">13</div><div class="lbl">Commit</div></div>
      <div class="stat"><div class="num" id="s-branches">4</div><div class="lbl">Branch</div></div>
      <div class="stat"><div class="num" id="s-authors">3</div><div class="lbl">Geliştirici</div></div>
    </div>

    <div id="detail-content">
      <div class="empty-state">
        <div class="icon">⎇</div>
        <p>Bir commit'e tıkla<br>detayları burada göreceksin</p>
      </div>
    </div>
  </div>
</div>

<script>
const BRANCHES = [
  { name: 'main',         col: 0, color: '#58a6ff' },
  { name: 'feature/auth', col: 1, color: '#3fb950' },
  { name: 'feature/ui',   col: 2, color: '#ff7b72' },
  { name: 'hotfix',       col: 3, color: '#d29922' },
];

const COMMITS = [
  { id:'a1b2c3', msg:'İlk commit — proje başlatıldı',        author:'Ali Yılmaz',   date:'14 Nis 2024', branch:0, parents:[],              files:[{n:'README.md',t:'add'},{n:'package.json',t:'add'}] },
  { id:'d4e5f6', msg:'Temel proje yapısı oluşturuldu',       author:'Ali Yılmaz',   date:'14 Nis 2024', branch:0, parents:['a1b2c3'],       files:[{n:'src/index.js',t:'add'},{n:'src/app.js',t:'add'}] },
  { id:'g7h8i9', msg:'Auth branch açıldı, login eklendi',    author:'Ayşe Kara',    date:'15 Nis 2024', branch:1, parents:['d4e5f6'],       files:[{n:'src/auth/login.js',t:'add'}] },
  { id:'j0k1l2', msg:'UI branch açıldı, buton bileşeni',     author:'Mehmet Demir', date:'15 Nis 2024', branch:2, parents:['d4e5f6'],       files:[{n:'src/ui/button.jsx',t:'add'}] },
  { id:'m3n4o5', msg:'Ana sayfa tasarımı tamamlandı',        author:'Mehmet Demir', date:'16 Nis 2024', branch:2, parents:['j0k1l2'],       files:[{n:'src/ui/home.jsx',t:'add'},{n:'src/ui/styles.css',t:'add'}] },
  { id:'p6q7r8', msg:'Login formu ve doğrulama eklendi',     author:'Ayşe Kara',    date:'16 Nis 2024', branch:1, parents:['g7h8i9'],       files:[{n:'src/auth/login.js',t:'mod'},{n:'src/auth/validate.js',t:'add'}] },
  { id:'s9t0u1', msg:'Kritik güvenlik açığı kapatıldı',      author:'Ali Yılmaz',   date:'17 Nis 2024', branch:3, parents:['d4e5f6'],       files:[{n:'src/app.js',t:'mod'}] },
  { id:'v2w3x4', msg:'Hotfix → main merge edildi',           author:'Ali Yılmaz',   date:'17 Nis 2024', branch:0, parents:['d4e5f6','s9t0u1'], isMerge:true, files:[{n:'src/app.js',t:'mod'}] },
  { id:'y5z6a7', msg:'JWT token sistemi kuruldu',            author:'Ayşe Kara',    date:'18 Nis 2024', branch:1, parents:['p6q7r8'],       files:[{n:'src/auth/token.js',t:'add'},{n:'src/auth/login.js',t:'mod'}] },
  { id:'b8c9d0', msg:'Navbar bileşeni tamamlandı',           author:'Mehmet Demir', date:'18 Nis 2024', branch:2, parents:['m3n4o5'],       files:[{n:'src/ui/navbar.jsx',t:'add'}] },
  { id:'e1f2g3', msg:'feature/auth → main merge edildi',     author:'Ali Yılmaz',   date:'19 Nis 2024', branch:0, parents:['v2w3x4','y5z6a7'], isMerge:true, files:[{n:'src/auth/login.js',t:'add'},{n:'src/auth/token.js',t:'add'}] },
  { id:'h4i5j6', msg:'feature/ui → main merge edildi',       author:'Ali Yılmaz',   date:'20 Nis 2024', branch:0, parents:['e1f2g3','b8c9d0'], isMerge:true, files:[{n:'src/ui/navbar.jsx',t:'add'},{n:'src/ui/home.jsx',t:'mod'}] },
  { id:'k7l8m9', msg:'v1.0.0 — İlk kararlı sürüm yayınlandı', author:'Ali Yılmaz', date:'20 Nis 2024', branch:0, parents:['h4i5j6'],      isRelease:true, files:[{n:'CHANGELOG.md',t:'add'},{n:'package.json',t:'mod'}] },
];

const cMap = {};
COMMITS.forEach((c,i) => { c.row = i; cMap[c.id] = c; });

const COL_W = 48, ROW_H = 60, PAD_L = 20, PAD_T = 30;
const R = 9;
const LABEL_X = PAD_L + BRANCHES.length * COL_W + 12;

function cx(c) { return PAD_L + c.branch * COL_W + COL_W/2; }
function cy(c) { return PAD_T + c.row * ROW_H; }

const canvas = document.getElementById('graph-canvas');
const W = LABEL_X + 280;
const H = PAD_T + COMMITS.length * ROW_H + PAD_T;
canvas.width = W * 2; canvas.height = H * 2;
canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
const ctx = canvas.getContext('2d');
ctx.scale(2, 2);

let selected = null;

function col(c) { return BRANCHES[c.branch].color; }

function hexAlpha(hex, a) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function draw() {
  ctx.clearRect(0,0,W,H);

  // Lane guides
  BRANCHES.forEach((b,i) => {
    const x = PAD_L + i * COL_W + COL_W/2;
    ctx.beginPath();
    ctx.moveTo(x, 0); ctx.lineTo(x, H);
    ctx.strokeStyle = hexAlpha(b.color, 0.08);
    ctx.lineWidth = 1;
    ctx.setLineDash([4,8]);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // Edges
  COMMITS.forEach(c => {
    c.parents.forEach(pid => {
      const p = cMap[pid];
      if (!p) return;
      ctx.beginPath();
      ctx.moveTo(cx(c), cy(c));
      if (c.branch === p.branch) {
        ctx.lineTo(cx(p), cy(p));
      } else {
        const midy = (cy(c) + cy(p)) / 2;
        ctx.bezierCurveTo(cx(c), midy, cx(p), midy, cx(p), cy(p));
      }
      ctx.strokeStyle = hexAlpha(col(c), 0.5);
      ctx.lineWidth = 2;
      ctx.stroke();
    });
  });

  // Nodes
  COMMITS.forEach(c => {
    const x = cx(c), y = cy(c);
    const isSel = selected && selected.id === c.id;
    const color = col(c);

    if (isSel) {
      ctx.beginPath();
      ctx.arc(x, y, R + 7, 0, Math.PI*2);
      ctx.fillStyle = hexAlpha(color, 0.18);
      ctx.fill();
    }

    // Shape
    ctx.beginPath();
    if (c.isRelease) {
      const s = R + 3;
      ctx.moveTo(x, y - s);
      ctx.lineTo(x + s*.87, y + s*.5);
      ctx.lineTo(x - s*.87, y + s*.5);
      ctx.closePath();
    } else if (c.isMerge) {
      const s = R;
      ctx.moveTo(x-s, y-s); ctx.lineTo(x+s, y-s);
      ctx.lineTo(x+s, y+s); ctx.lineTo(x-s, y+s);
      ctx.closePath();
    } else {
      ctx.arc(x, y, R, 0, Math.PI*2);
    }
    ctx.fillStyle = isSel ? color : hexAlpha(color, 0.85);
    ctx.fill();
    if (isSel) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Hash above node
    ctx.font = '9px JetBrains Mono, monospace';
    ctx.fillStyle = hexAlpha(color, 0.6);
    ctx.textAlign = 'center';
    ctx.fillText(c.id.slice(0,6), x, y - R - 5);

    // Message label
    const msg = c.msg.length > 38 ? c.msg.slice(0,36)+'…' : c.msg;
    ctx.font = isSel ? '500 12px Sora, sans-serif' : '12px Sora, sans-serif';
    ctx.fillStyle = isSel ? '#e6edf3' : '#8b949e';
    ctx.textAlign = 'left';
    ctx.fillText(msg, LABEL_X, y + 4);
  });
}

function getCommit(mx, my) {
  for (const c of COMMITS) {
    const dx = mx - cx(c), dy = my - cy(c);
    if (dx*dx + dy*dy <= (R+10)*(R+10)) return c;
  }
  return null;
}

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);
  const c = getCommit(mx, my);
  if (c) { selected = c; draw(); showDetail(c); }
});

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);
  canvas.style.cursor = getCommit(mx, my) ? 'pointer' : 'default';
});

function fileIcon(t) {
  if (t==='add') return ['fs-add','A'];
  if (t==='mod') return ['fs-mod','M'];
  return ['fs-del','D'];
}

function showDetail(c) {
  const branch = BRANCHES[c.branch];
  const tags = [
    `<span class="tag tag-hash">${c.id}</span>`,
    `<span class="tag tag-branch">⎇ ${branch.name}</span>`,
    c.isMerge ? `<span class="tag tag-merge">merge commit</span>` : '',
    c.isRelease ? `<span class="tag tag-release">🏷 release</span>` : '',
  ].filter(Boolean).join('');

  const files = c.files.map(f => {
    const [cls, lbl] = fileIcon(f.t);
    return `<div class="file-item"><span class="file-status ${cls}">${lbl}</span><span class="file-name">${f.n}</span></div>`;
  }).join('');

  const parents = c.parents.length
    ? `<div class="parents-section"><h4>Önceki commit(ler)</h4>${c.parents.map(p=>`<span class="parent-hash" onclick="jumpTo('${p}')">${p}</span>`).join('')}</div>`
    : '';

  document.getElementById('detail-content').innerHTML = `
    <div class="commit-card">
      <div class="tag-row">${tags}</div>
      <h3>${c.msg}</h3>
      <div class="meta-grid">
        <div class="meta-item"><div class="key">Geliştirici</div><div class="val">${c.author}</div></div>
        <div class="meta-item"><div class="key">Tarih</div><div class="val">${c.date}</div></div>
        <div class="meta-item"><div class="key">Değişen dosya</div><div class="val">${c.files.length} dosya</div></div>
        <div class="meta-item"><div class="key">Commit ID</div><div class="val">${c.id}</div></div>
      </div>
      <div class="files-section">
        <h4>Değişen dosyalar</h4>
        <div class="file-list">${files}</div>
      </div>
      ${parents}
    </div>
  `;
}

window.jumpTo = function(id) {
  const c = cMap[id];
  if (c) { selected = c; draw(); showDetail(c); }
};

// Branch pills
const pillsEl = document.getElementById('branch-pills');
BRANCHES.forEach(b => {
  const el = document.createElement('div');
  el.className = 'branch-pill';
  el.innerHTML = `<span class="branch-dot" style="background:${b.color}"></span>${b.name}`;
  pillsEl.appendChild(el);
});

draw();
</script>
</body>
</html>
